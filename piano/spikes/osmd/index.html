<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Spike — OSMD notehead mapping</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 12px;
      font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
      background: #12151c; color: #c9cfda;
    }
    h1 { font-size: 17px; margin: 0 0 4px; }
    .sub { color: #7f8899; font-size: 13px; margin: 0 0 14px; }

    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    button {
      font: inherit; padding: 9px 14px; border-radius: 8px; cursor: pointer;
      background: #232936; color: #c9cfda; border: 1px solid #333b4a;
    }
    button:active { background: #2c3341; }
    button.primary { background: #1c2536; border-color: #4ea3ff; color: #4ea3ff; }

    /* The overlay must share an origin with OSMD's SVG, so they live in one
       positioned wrapper. This is the arrangement the real render/ module would use. */
    #stage { position: relative; background: #fff; border-radius: 8px; overflow-x: auto; }
    #score { position: relative; }
    #overlay { position: absolute; inset: 0; pointer-events: none; }

    .marker {
      position: absolute; border: 1.5px solid #ff2d55; border-radius: 3px;
      background: rgba(255,45,85,0.12);
    }
    .marker.bad { border-color: #ff9500; background: rgba(255,149,0,0.2); }
    .label {
      position: absolute; font: 700 9px/1 system-ui, sans-serif; color: #0a58ca;
      transform: translateY(-3px);
    }
    #playhead {
      position: absolute; width: 2px; background: #ffb020;
      box-shadow: 0 0 6px rgba(255,176,32,0.8);
    }

    #report {
      margin-top: 16px; padding: 12px; border-radius: 8px;
      background: #1a1f2b; border: 1px solid #2c3341;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: pre-wrap; word-break: break-word;
    }
    .ok { color: #3ecf8e; } .warn { color: #ffb020; } .fail { color: #ff6b6b; }
    a { color: #4ea3ff; }
  </style>
  <script type="module" crossorigin src="/piano/assets/osmd-DWjUaxNJ.js"></script>
  <link rel="modulepreload" crossorigin href="/piano/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/piano/assets/opensheetmusicdisplay.min-CQSAqopO.js">
</head>
<body>
  <h1>Spike — OSMD notehead mapping</h1>
  <p class="sub">
    Red boxes are where the adapter thinks each notehead is. Blue letters are the derived pitch.
    If the boxes sit on the noteheads and the letters read E E F G, the mapping works.
    <a href="../../index.html">← spikes</a>
  </p>

  <div class="controls">
    <button id="play" class="primary">Run playhead</button>
    <button id="toggle">Hide markers</button>
    <button id="zoomIn">Zoom +</button>
    <button id="zoomOut">Zoom −</button>
    <button id="copy">Copy report</button>
  </div>

  <div id="stage">
    <div id="score"></div>
    <div id="overlay"><div id="playhead" hidden></div></div>
  </div>

  <div id="report">Loading…</div>

</body>
</html>
